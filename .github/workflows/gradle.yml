name: Build Protocol

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Cloudburst Protocol
        working-directory: CloudburstProtocol/Protocol-3.0
        run: ./gradlew build
